server {
  listen 80;
  server_name _;

  location = /health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location = /signup {
    return 301 /signup/;
  }

  location = /admin {
    return 301 /admin/;
  }

  location = /workspace {
    return 301 /workspace/;
  }

  location = /workspace/calendar {
    return 301 /workspace/calendar/;
  }

  location = /workspace/brand-brief {
    return 301 /workspace/brand-brief/;
  }

  location = /workspace/new-campaign {
    return 301 /workspace/new-campaign/;
  }

  location = /workspace/campaigns {
    return 301 /workspace/campaigns/;
  }

  location = /workspace/campaigns/winter-campaign {
    return 301 /workspace/campaigns/winter-campaign/;
  }

  location /signup/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ =404;
  }

  location /admin/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ =404;
  }

  location /workspace/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ =404;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}
