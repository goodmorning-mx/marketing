<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GoodMorning Marketing — ready for redevelopment." />
    <title>GoodMorning Marketing</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; background: #f5f7fb; color: #172033; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(640px, calc(100% - 40px)); padding: 48px; box-sizing: border-box; background: #fff; border: 1px solid #e5e9f0; border-radius: 20px; box-shadow: 0 20px 60px #17203312; }
      .mark { display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: #182235; color: #fff; font-weight: 800; letter-spacing: -0.08em; }
      h1 { margin: 28px 0 10px; font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: -0.06em; }
      p { margin: 0; color: #69758a; font-size: 1.1rem; line-height: 1.6; }
      small { display: block; margin-top: 28px; color: #a0a9b8; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark">gm</span>
      <h1>Ready for redevelopment.</h1>
      <p>The GoodMorning Marketing platform has been reset. This URL is preserved for the new build.</p>
      <small>GoodMorning</small>
    </main>
  </body>
</html>
