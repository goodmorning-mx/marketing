name: Account flow checks

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  account-and-migration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: marketing_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marketing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Test invitations, sessions, and workspace isolation on PostgreSQL 16
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/marketing_test
        run: PYTHONPATH=. pytest -q tests
      - name: Test Brand Brief save recovery and conflict handling
        run: node --test frontend/tests/brand-brief-flow.test.cjs
      - name: Check Brand Brief scripts
        run: node --check frontend/workspace/brand-brief-flow.js && node --check frontend/workspace/workspace.js
      - name: Check backend syntax
        run: python -m compileall -q backend/app backend/tests
      - name: Build clean backend image
        run: docker build --pull --no-cache --tag goodmarketing-backend:ci --file backend/Dockerfile backend
      - name: Build clean frontend image
        run: docker build --pull --no-cache --tag goodmarketing-frontend:ci --file frontend/Dockerfile frontend
      - name: Smoke-test frontend image startup and account pages
        run: |
          docker run --detach --name goodmarketing-frontend-ci --publish 127.0.0.1:8080:80 \
            --env VITE_API_URL=https://api.dev.marketing.goodmorning.mx goodmarketing-frontend:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 1
          done
          docker exec goodmarketing-frontend-ci nginx -t
          curl --fail --silent http://127.0.0.1:8080/health | grep -q '^ok$'
          curl --fail --silent http://127.0.0.1:8080/login/ | grep -q 'id="login-form"'
          curl --fail --silent http://127.0.0.1:8080/activate/ | grep -q 'id="activate-form"'
          docker rm --force goodmarketing-frontend-ci
