name: Marketing Adapters preservation

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  adapters-and-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: marketing_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marketing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Test adapters, demo requests, and PostgreSQL 16 migrations
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/marketing_test
        run: PYTHONPATH=. pytest -q tests
      - name: Check backend syntax
        run: python -m compileall -q backend/app backend/tests backend/scripts
      - name: Build clean backend image
        run: docker build --pull --no-cache --tag goodmarketing-backend:ci --file backend/Dockerfile backend
      - name: Build clean frontend image
        run: docker build --pull --no-cache --tag goodmarketing-frontend:ci --file frontend/Dockerfile frontend
      - name: Smoke-test API and Nginx startup
        run: |
          set -euo pipefail
          cleanup() {
            docker rm --force goodmarketing-api-ci goodmarketing-frontend-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name goodmarketing-api-ci --network host \
            --env DATABASE_URL=postgresql+psycopg://postgres:postgres@127.0.0.1:5432/marketing_test \
            --env APP_NAME='GoodMorning Marketing Adapters API' --env APP_ENV=dev \
            --env CORS_ORIGINS=https://dev.marketing.goodmorning.mx \
            goodmarketing-backend:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          docker run --detach --name goodmarketing-frontend-ci --publish 127.0.0.1:8080:80 goodmarketing-frontend:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 1
          done
          docker exec goodmarketing-frontend-ci nginx -t
          curl --fail --silent http://127.0.0.1:8080/health | grep -q '^ok$'
          curl --fail --silent http://127.0.0.1:8080/signup/ | grep -q 'demo-requests'
