server {
  listen 80;
  server_name _;

  location = /health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location = /learn-more {
    return 301 /learn-more/;
  }

  location = /pricing {
    return 301 /pricing/;
  }

  location = /coming-soon {
    return 301 /coming-soon/;
  }

  location = /signup {
    return 301 /signup/;
  }

  location = /admin {
    return 301 /admin/;
  }

  location = /workspace {
    return 301 /workspace/;
  }

  location = /workspace/calendar {
    return 301 /workspace/calendar/;
  }

  location = /workspace/brand-brief {
    return 301 /workspace/brand-brief/;
  }

  location = /workspace/new-campaign {
    return 301 /workspace/new-campaign/;
  }

  location = /workspace/campaigns {
    return 301 /workspace/campaigns/;
  }

  location = /workspace/campaigns/winter-campaign {
    return 301 /workspace/campaigns/winter-campaign/;
  }

  location /learn-more/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ =404;
  }

  location /pricing/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ =404;
  }

  location /coming-soon/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ =404;
  }

  location /signup/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ =404;
  }

  location /admin/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ =404;
  }

  location /workspace/ {
    auth_request /_gm_auth_check;
    error_page 401 = @customer_login;
    add_header Cache-Control "private, no-store" always;
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ =404;
  }

  location = /_gm_auth_check {
    internal;
    proxy_pass ${VITE_API_URL}/auth/me;
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }

  location @customer_login {
    add_header Cache-Control "private, no-store" always;
    return 302 /login/?next=$uri;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}
