server {
  listen 80;
  server_name _;

  location = /health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location = /signup {
    return 301 /signup/;
  }

  location = /admin {
    return 301 /admin/;
  }

  location /signup/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ =404;
  }

  location /admin/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ =404;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}
